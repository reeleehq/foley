# Reference compose file for the authenticated HTTP MCP server (#42).
#   cd deploy/mcp-http && FOLEY_MCP_TOKEN="$(openssl rand -hex 32)" docker compose up -d --build
# Guide: misc/docs/deploy-mcp-http.md
services:
  foley-mcp:
    build:
      context: ../..
      dockerfile: deploy/mcp-http/Dockerfile
      args:
        FOLEY_EXTRAS: ${FOLEY_EXTRAS:-mcp,freesound,openverse,wikimedia-commons}
    image: foley-mcp:local
    # Uncomment for the local-first posture (no external sources, telemetry off):
    # command: ["--offline"]
    environment:
      # Accepted bearer tokens, whitespace-separated (two during a rotation). Required.
      FOLEY_MCP_TOKEN: ${FOLEY_MCP_TOKEN:?set FOLEY_MCP_TOKEN, e.g. openssl rand -hex 32}
      # Optional source keys; unset ones just leave that source unavailable.
      FREESOUND_API_KEY: ${FREESOUND_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"  # loopback only: the TLS proxy is the public face
    volumes:
      - foley-data:/data  # the library, sessions, runs and provenance ($FOLEY_DATA_DIR)
    restart: unless-stopped

volumes:
  foley-data: {}
