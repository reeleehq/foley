[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

# Ship the whole foley package incl. the tiny Ring-0 synthetic fixture
# (foley/data/ring0/*) so `foley demo` needs no corpus download (it still needs
# the foley[audio,clap] runtime extras; the CLAP model downloads on first use).
[tool.hatch.build.targets.wheel]
include = [
    "foley",
]

[tool.hatch.build.targets.sdist]
include = [
    "foley",
    "tests",
    "tools",
    "misc",
    "pyproject.toml",
    "README.md",
]

[project]
name = "foley"
version = "0.0.67"
description = "Unified facade for sourcing, indexing, and searching sound effects to weave into narration"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "sound-effects",
    "sfx",
    "audio",
    "foley",
    "audio-retrieval",
    "clap",
    "text-to-audio",
    "narration",
    "sound-design",
]
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "dol", # storage as a Mapping, local->cloud (byte + meta stores)
    "ocracy>=0.1.12", # ocracy.kit: the fleet's param_map translator + key chain (stdlib-only, no deps)
]

[project.license]
text = "mit"

[project.scripts]
foley = "foley.cli:main"
foley-mcp = "foley.agent.mcp:_cli"

[project.urls]
Homepage = "https://github.com/thorwhalen/foley"
Repository = "https://github.com/thorwhalen/foley"
Documentation = "https://thorwhalen.github.io/foley"

[project.optional-dependencies]
audio = [
    "numpy",
    "soundfile",
    "soxr",
    "librosa",
    "pyloudnorm",
]
# CLAP embedder — the joint text<->audio retrieval engine (laion/larger_clap_general).
clap = [
    "transformers>=4.40",
    "torch",
]
# CLAP on a small host (#116): the int8 ONNX build of the same checkpoint
# (Xenova/larger_clap_general), ~205 MB and ~0.6 GB RAM, no torch or transformers.
# Used for the generation prompt-match check when the full embedder cannot load.
# Imported lazily inside foley.index.onnx_clap ONLY. Deliberately NOT in
# [tool.wads.ci.install] — its tests inject fake sessions and never download the model.
clap-onnx = [
    "onnxruntime",
    "tokenizers",
    "huggingface_hub",
    "numpy",
]
# Hybrid vector+keyword index — LanceDB (vector column + Tantivy FTS + RRF in one table).
index = [
    "lancedb>=0.13",
]
# Minimal single-file fallback index (sqlite-vec + stdlib FTS5); no LanceDB needed.
index-sqlite = [
    "sqlite-vec>=0.1.0",
]
# Supervised AudioSet tagging on ingest — PANNs CNN14 (checkpoint auto-downloads).
tag = [
    "panns-inference",
]
# Retrieval-eval oracle — for the OPT-IN metric cross-check test ONLY. The nDCG
# PR gate + all metric code are pure numpy/stdlib and never import ranx. ranx
# pulls the numba/llvmlite chain foley bans from CI (same reason librosa is
# excluded from the "test" extra); it is deliberately NOT in
# [tool.wads.ci.install]. (pytrec_eval is a numba-free alternative but needs a
# compiler, so it is left out of the declared extra.)
eval = [
    "ranx>=0.3",
]
# Audio captioning on ingest (EnCLAP / Qwen2-Audio adapters plug in behind the
# Captioner protocol; no default ships yet). transformers/torch already in [clap].
caption = [
    "transformers>=4.40",
    "torch",
    "torchaudio",
]
# Live Freesound APIv2 retrieve adapter (by-reference; CC0). `requests` is imported
# lazily inside foley.sources.http.requests_transport ONLY, so the core stays
# dol-only. Deliberately NOT added to [tool.wads.ci.install] — the adapter tests
# inject a fake transport and never touch the network, keeping CI hermetic.
freesound = [
    "requests",
]
# Keyless retrieve sources (#79). `requests` is imported lazily inside
# foley.sources.http.requests_transport ONLY. Deliberately NOT in [tool.wads.ci.install]:
# their tests inject a fake transport and never touch the network.
openverse = [
    "requests",
]
wikimedia-commons = [
    "requests",
]
internet-archive = [
    "requests",
]
# Hosted ElevenLabs Sound Effects generator (#6). `requests` is imported lazily
# inside foley.sources.http.requests_transport ONLY, so the core stays dol-only.
# Deliberately NOT in [tool.wads.ci.install] — the adapter tests inject a fake
# transport and never touch the network (same rationale as freesound).
elevenlabs = [
    "requests",
]
# fal-hosted generators (#73): Stable Audio 3 Small-SFX, ElevenLabs, Sonilo, MMAudio,
# executed through falaw (imported lazily inside foley.sources.fal.adapter ONLY).
# Deliberately NOT in [tool.wads.ci.install] — the adapter tests inject a fake runner.
fal = [
    "falaw[fal]",  # falaw's [fal] extra brings fal-client, the network client
]
# Local Stable Audio Open 1.0 generator (#6) — diffusers StableAudioPipeline. Heavy
# ML stack, lazy-imported inside foley.sources.stable_audio.adapter ONLY, so
# `import foley` + source discovery stay dol-only. Deliberately NOT in
# [tool.wads.ci.install] — the primary adapter test injects a fake pipeline (no
# torch) and the seeded-determinism test is importorskip('torch')-guarded, keeping
# CI hermetic and numba-free.
stable-audio = [
    "torch",
    "diffusers>=0.27",
    "transformers>=4.40",
    "soundfile",
    "accelerate",
]
# Generation disclosure / watermarking (#9b): AudioSeal (MIT code+weights) marks
# generated clips; torchaudio does the 44.1k<->16k resample. Imported lazily inside
# foley.sources.disclosure watermark functions ONLY, so `import foley` + source
# discovery stay dol-only; the stdlib safety-scan / Art.50-checklist / JSON
# content-credential sidecar need none of this. Deliberately NOT in
# [tool.wads.ci.install] — tests inject a fake watermarker + a dict provenance store;
# the real-AudioSeal round-trip test is importorskip-guarded, keeping CI torch-free.
# (The signed+embedded C2PA writer — c2pa-python — arrives with weave/#8.)
provenance = [
    "audioseal",
    "torch",
    "torchaudio",
    "numpy",
    "soundfile",
]
# Vendor-neutral OpenTelemetry trace EXPORT for the run-artifact mirror (#11).
# opentelemetry-sdk transitively pulls opentelemetry-api + semantic-conventions, so
# foley[obs] can both create AND export GenAI spans; the host app still calls
# set_tracer_provider to actually export. opentelemetry is imported LAZILY inside
# foley.obs.trace.OTelTracer ONLY, so `import foley` stays dol-only and a bare install
# still emits a stdlib RunManifest (only the OTel span mirror needs this extra).
# Deliberately NOT in [tool.wads.ci.install] — obs tests use the stdlib no-op tracer +
# a dict run store and never import opentelemetry, keeping CI hermetic.
obs = [
    "opentelemetry-sdk>=1.37",
]
# The SELECT agent's LLM rungs (#7): decompose_context + the LLM-judge + refine.
# `anthropic` is imported LAZILY inside AnthropicDecomposer / AnthropicJudge /
# AnthropicRefiner method bodies ONLY, so `import foley` + `import foley.agent` stay
# dol-only. form-B json_schema structured output means no pydantic — the extra is just
# the LLM client. Deliberately NOT in [tool.wads.ci.install] — the deterministic fakes
# (KeywordDecomposer / ClapJudge / StringOverlapJudge / KeywordRefiner) are the resolved
# defaults, so the whole find() loop runs in CI with no network / ANTHROPIC_API_KEY /
# anthropic import; the real-path test injects a fake client (importorskip-guarded).
agent = [
    "anthropic",
    "falaw>=0.0.63", # the LLM price table (llm_call_cost_usd)
]
# Offline / local-LLM SELECT rungs: the OpenAI-compatible client for an on-device endpoint
# (Ollama / llama.cpp / vLLM), so decompose/judge/refine run with nothing leaving the device.
# `openai` is imported LAZILY inside foley.agent.local_llm call paths ONLY, so `import foley`
# + `import foley.agent` stay dol-only; the fakes remain the resolved defaults (tests inject a
# fake client). Deliberately NOT in [tool.wads.ci.install].
local-llm = [
    "openai",
]
# Tier-2 fit-evaluation heavy path (#10b): the audio-LM listen-check (Qwen2-Audio) for
# AudioLMJudge + real PANNs/CLAP embedders for FAD-P/KAD generation fidelity. All of
# transformers/torch/torchaudio are imported LAZILY inside AudioLMJudge.judge() /
# _build_pipeline ONLY, so `import foley` + `import foley.eval` stay dol-only. The
# Tier-2 pure-numpy metrics (fit_precision, krippendorff_alpha, frechet_distance,
# kernel_audio_distance) need NONE of this — CI uses the deterministic StringOverlapJudge
# fake + an injected fake embedder. Deliberately NOT in [tool.wads.ci.install] (stays
# ['test']); the real Qwen2-Audio round-trip test is importorskip-guarded. Exact FAD/KAD
# reference numbers (fadtk/kadtk) are optional externals, not pinned here.
fit = [
    "transformers>=4.40",
    "torch",
    "torchaudio",
]
# WEAVE forced alignment (#8): the real WhisperXAligner (≈±50 ms word timestamps).
# `whisperx`/`torch` are imported LAZILY inside WhisperXAligner.word_timeline ONLY, so
# `import foley` + `import foley.weave` stay dol-only; the deterministic FakeAligner
# (evenly-spaced words, torch-free) is the resolved default, so the whole weave()
# pipeline runs in CI with no torch. Deliberately NOT in [tool.wads.ci.install] — the
# real-alignment test is importorskip('whisperx')-guarded, keeping CI hermetic.
align = [
    "whisperx",
    "torch",
]
# WEAVE optional DSP/export upgrades (#8): OpenTimelineIO export (to_otio) and the
# reserved pyroomacoustics/recorded-IR reverb path. `opentimelineio` is imported
# LAZILY inside to_otio ONLY (to_edl is a pure-stdlib CMX3600 fallback, always
# available), so `import foley.weave` stays dol-only. The default render/mix/master
# path is pure-numpy + pyloudnorm (the existing `audio` extra — NO redundant
# pyloudnorm here, per invariant 4). Deliberately NOT in [tool.wads.ci.install] — the
# OTIO round-trip test is importorskip('opentimelineio')-guarded.
weave = [
    "opentimelineio",
    "pyrubberband", # pitch-preserving time-stretch (shells out to the `rubberband` binary)
]
# WEAVE signed + embedded C2PA (#8, re-asserting PR #25's deferral): the signer that
# would promote the content-credential sidecar into a signed, embedded manifest over
# the final mix. `c2pa` is imported LAZILY inside _sign_and_embed ONLY, which is a
# fail-safe no-op (sidecar-only) without the lib AND a cert — so `import foley.weave`
# stays dol-only and weaving never depends on it. Deliberately NOT in
# [tool.wads.ci.install]; the sidecar (build_content_credential) needs none of this.
c2pa = [
    "c2pa-python",
    "cryptography",  # foley.provenance.make_c2pa_signer / make_self_signed_c2pa_certs
]
# The MCP server (#12): serve foley's façade to agents/humans as JSON-safe tools via
# py2mcp (which pulls fastmcp). `py2mcp` is imported LAZILY inside
# foley.agent.mcp.build_mcp_server ONLY, so `import foley` + `import foley.agent` stay
# dol-only; the whole tool surface is defined without it. Deliberately NOT in
# [tool.wads.ci.install] — the MCP tests build/list tools with injected fakes and
# assert JSON-safety with no py2mcp import (the real-server test is importorskip-guarded).
mcp = [
    "py2mcp",
]
test = [
    "falaw>=0.0.63", # llm_call_cost_usd prices the LLM-rung budget tests
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "numpy",
    "soundfile",
    "soxr", # so resample/encode tests execute in CI (skipif-guarded in lean envs)
    "pyloudnorm", # so LUFS tests execute in CI
    # NB: librosa is intentionally NOT here — it pulls numba/llvmlite, which have no
    # wheels / a hard <3.10 guard on new CPython patches and break the CI install;
    # trim_silence tests importorskip librosa and run locally via foley[audio]. The
    # heavy backends (lancedb, sqlite-vec, torch) are likewise out — their tests are
    # importorskip/skipif-guarded (foley[index]/[index-sqlite]/[clap]).
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
markers = [
    "audiofile: requires an audio-file codec lib (soundfile) to run",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

# Extras the wads CI installs (`.[extras]`). "test" pulls numpy/soundfile/soxr/
# pyloudnorm so the numpy-backed tests (base/qc/audio/search/taxonomy and the
# MemoryIndex hybrid+library path) actually run in CI. It deliberately omits
# librosa (numba/llvmlite break the CI install) and the heavy backends
# (lancedb/sqlite-vec/torch) — those tests importorskip/skipif-guard and run
# locally via foley[audio]/[index]/[index-sqlite]/[clap]. Without this section the
# CI installs only core deps and any top-level numpy import errors on collection.
[tool.wads.ci.install]
extras = [
    "test",
]

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
